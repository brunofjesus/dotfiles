# Set leader key to `
unbind C-b
set -g prefix `
bind ` send-prefix

# Hot reload config on <leader>r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Mouse support and terminal settings
set -g mouse on
set -g default-terminal "tmux-256color"
# Forward extended keys (C-., C-;, S-Enter, etc.) to apps like nvim
# Force tmux to always pass through extended keys
set -g extended-keys on
#set -g extended-keys-format csi-u
# Match the OUTER terminal's $TERM (xterm-kitty, xterm-ghostty, ...), not "kitty".
# NOTE: kitty ignores tmux's modifyOtherKeys request, so keys like C-. / C-;
# won't reach nvim through kitty via this feature alone. See kitty.conf remaps,
# which make kitty emit CSI-u directly. Ghostty works out of the box.
set -as terminal-features 'xterm*:extkeys'

set-option -g status-position bottom
set -g set-clipboard on
set -g detach-on-destroy off # Don't exit from tmux when closing a session

# Window and pane numbering
set -g base-index 1                   # Start windows at 1, not 0
setw -g pane-base-index 1             # Start panes at 1, not 0
set-window-option -g pane-base-index 1
set-option -g renumber-windows on     # Renumber windows when one is closed

# Window behavior
set-option -g allow-rename off        # Don't rename windows automatically

# Enable Image Display
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Pane splitting (open in current directory)
bind '"' split-window -v -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"

# New window in same path
bind c new-window -c "#{pane_current_path}"

# VI Mode
set-window-option -g mode-keys vi

# Window navigation
bind -n M-Left previous-window
bind -n M-Right next-window

# Pane resizing with leader + HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z # Use m key to maximize pane

# Pane resizing with leader + Arrow keys
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5

# Reorder windows with Alt-i / Alt-o
bind-key 'i' swap-window -t -1\; select-window -t -1
bind-key 'o' swap-window -t +1\; select-window -t +1

# Vi-style copy mode keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

## You should change `pbcopy` to your clipboard command!
#bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel "pbcopy"

# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# Highlight pane when entering copy mode
set-hook -g pane-mode-changed { if -F "#{pane_in_mode}" "selectp -P bg=#181818" "selectp -P default" }

# Session switcher with sesh - shows all sessions, zoxide dirs, and more
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Jump to last session quickly
# bind -N "last-session (via sesh)" o run-shell "sesh last"

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Vim tmux navigator
set -g @plugin 'christoomey/vim-tmux-navigator'

# Catppuccin
set -g @plugin 'catppuccin/tmux'
# Catppuccin flavor follows the OS light/dark theme (latte = light, frappe = dark).
# set-theme.sh (run by the dark-mode switcher) writes current-flavor.conf and
# live-reloads open sessions. On a fresh start with no saved choice we detect the
# current appearance: macOS via AppleInterfaceStyle, Linux via GNOME color-scheme.
if-shell '[ -f ~/.config/tmux/current-flavor.conf ]' \
  'source-file ~/.config/tmux/current-flavor.conf' \
  { if-shell 'defaults read -g AppleInterfaceStyle 2>/dev/null | grep -qi dark || gsettings get org.gnome.desktop.interface color-scheme 2>/dev/null | grep -qi dark' \
      "set -g @catppuccin_flavor 'frappe'" \
      "set -g @catppuccin_flavor 'latte'" }
# Catppuccin customizations (kept in a separate file so set-theme.sh can
# re-apply them after a flavor reset — the reset wipes these options).
source-file ~/.config/tmux/catppuccin.conf

# OS Agnostic copy command
set -g @plugin 'tmux-plugins/tmux-yank'

# Floating panes
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind '-n M-f'

# Open highlighted text (o -> Browser, C-o -> Editor)
set -g @plugin 'tmux-plugins/tmux-open'

run '~/.config/tmux/plugins/tpm/tpm'
