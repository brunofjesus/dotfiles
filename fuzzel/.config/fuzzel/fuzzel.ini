[main]
font = "FiraCode Nerd Font:size=12"
dpi-aware = auto
icons-enabled = yes
anchor = "center"
lines = 20
minimal-lines = yes
width = 60

horizontal-pad = 10
vertical-pad = 10

include = "~/.config/fuzzel/theme.ini"

[border]
radius = 0

[key-bindings]
# unbind Ctrl+k
delete-line-forward = none
prev = Up Control+p Control+k
next = Down Control+n Control+j
